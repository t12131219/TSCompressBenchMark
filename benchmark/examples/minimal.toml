schema = "tsbench.experiment/1"
name = "minimal-object-loop"
output = "../../runs/minimal-object-loop"

[[datasets]]
id = "float64-tail"
format = "npy"
path = "data/float64.npy"
component = "V"

[[methods]]
id = "raw"
codec = "raw-store"

[[methods]]
id = "zstd-3"
codec = "zstd-frame"
params = { compression_level = 3 }

[[methods]]
id = "lzss"
codec = "lzss-raw"

[task]
kind = "values"
fidelity = "bitwise"
boundary = "object_memory"
lifecycle = "independent_object"
cache_policy = "natural"

[[profiles]]
id = "cpu-single"
device = "cpu"
native_threads = 1
object_workers = 1

[execution]
sessions = 1
rounds = 7
warmup_objects = 2
seed = 20261013
timeout_s = 120
qualification_cache = true

[analysis]
summary = "median_iqr"
inference = "none"
