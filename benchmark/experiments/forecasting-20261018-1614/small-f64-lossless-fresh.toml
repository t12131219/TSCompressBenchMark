[[profiles]]
id = "cpu-single"
device = "cpu"
native_threads = 1
object_workers = 1
memory_limit_mb = 8192
runtime_preload = ["/usr/lib/x86_64-linux-gnu/libstdc++.so.6"]

[task]
kind = "values"
fidelity = "bitwise"
boundary = "native_core"
lifecycle = "fresh_request"
cache_policy = "natural"

[execution]
sessions = 2
rounds = 7
warmup_objects = 0
native_loops = 8
native_warmup_loops = 2
native_batch_memory_mb = 256
timeout_s = 1800
qualification_cache = true
save_artifacts = false
max_pending_workers = 8
seed = 20261018

[analysis]
summary = "median_iqr"
inference = "none"
