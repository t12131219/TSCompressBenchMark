encoding = "utf-8"
delimiter = ","
columns = ["OT"]
timestamp_column = "date"
timestamp_parser = "datetime64"
time_unit = "ns"
missing = "reject"
start = 2048
stop = 2176
step = 1
source = "etth1:column=OT:source_rows=2048:2176"
order = "C"
schema = { "roles" = { "V" = "V" }, "topology" = "UTS", "columns" = ["OT"], "gpu_source_projection" = { "source_id" = "etth1", "source_csv_path" = "/home/fzg/PycharmProjects/材料/TSBench_Corpus/ETTh1.csv", "source_csv_sha256" = "sha256:f18de3ad269cef59bb07b5438d79bb3042d3be49bdeecf01c1cd6d29695ee066", "column" = "OT", "source_row_window" = [2048, 2176], "step" = 1, "source_dtype_conversion" = "CSV decimal via explicit Python float to little-endian f64", "rank_projection" = "existing loader represents exactly one selected CSV column as V[N]; no flattening of multiple channels", "normalization" = "none", "resampling" = "none", "missing" = "reject", "unit" = "source_units_unverified", "unit_evidence" = "oil temperature; exact physical unit unverified in the frozen source evidence", "license_status" = "dataset_repository_declared", "license_spdx" = "CC-BY-ND-4.0", "license_scope" = "Root LICENSE of the author-maintained dataset repository; README describes its own collected/donated data. This is not an inference from a third-party code repository.", "data_distribution_policy" = "unchanged external local CSV only; no source data or derived windows bundled or redistributed" } }
