# Independent post-observation margin sensitivity; prior failures remain unchanged.
schema = "tsbench.gpu-experiment/1"
name = "gpu-real-single-f64-margin90-abs-0p1"
asset_root = "/home/fzg/PycharmProjects/TSDataCompressBenchMark"
boundaries = ["host_to_host", "device_resident"]

[task]
kind = "values"
fidelity = "bounded_abs"
error_bound = "0.1"
lifecycle = "independent_object"
cache_policy = "natural"
special_values = "bitwise"
invalid_values = "preserve"

[profile]
id = "cuda-device0-host-single"
device = "cuda"
device_index = 0
native_threads = 1
object_workers = 1
host_memory_limit_mb = 16384
affinity = [0]

[execution]
sessions = 3
rounds = 7
warmup_objects = 2
seed = 20261013
timeout_s = 120
save_artifacts = true

[[methods]]
id = "cuszp-fixed-margin90"
codec = "cuszp-fixed-1d"
error_bound = "0.09"

[[datasets]]
id = "etth1-single-f64-n128"
format = "csv"
