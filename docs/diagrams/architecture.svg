<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1645" viewBox="0 0 1440 1645" role="img"><title>TSBench V4.0 architecture.svg</title><desc>依据V4.0计划绘制。2026-10-15设计修订：37真实CPU codec加raw，共38个key已完成两个生命周期直接原生测量；28组358请求、348完整有效、10不支持，4872/4872正式批次成功，715项测试通过；输入与流验证在主计时外，storage区分caller和owner；此前六组2534/2534 trials保留历史身份，C1/RW API及object辅助继续保留。</desc><defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrow-2467a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2467a9"/></marker><marker id="arrow-14786c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14786c"/></marker><marker id="arrow-7655a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7655a5"/></marker><marker id="arrow-b45346" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45346"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="56" y="315" width="1328" height="244" rx="18" fill="#fcfdff" stroke="#c5d1de" stroke-width="1.8"/><rect x="56" y="625" width="1328" height="550" rx="18" fill="#fcfdff" stroke="#c5d1de" stroke-width="1.8"/><path d="M 248 255 L 248 315" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 720 255 L 720 315" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 1192 255 L 1192 315" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 870 438 L 925 438" fill="none" stroke="#7655a5" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-7655a5)" marker-start="url(#arrow-7655a5)"/><path d="M 280 559 L 280 689" fill="none" stroke="#14786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-14786c)"/><path d="M 720 559 L 720 689" fill="none" stroke="#7655a5" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-7655a5)"/><path d="M 1155 559 L 1155 689" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 280 869 L 280 937" fill="none" stroke="#14786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-14786c)"/><path d="M 720 869 L 720 937" fill="none" stroke="#7655a5" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-7655a5)"/><path d="M 1155 869 L 1155 905 L 900 905 L 900 937" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 500 1175 L 500 1238" fill="none" stroke="#14786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-14786c)"/><path d="M 500 1363 L 500 1430" fill="none" stroke="#14786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-14786c)"/><path d="M 1160 1363 L 1160 1430" fill="none" stroke="#7655a5" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-7655a5)" stroke-dasharray="8 6"/><rect x="56" y="145" width="384" height="110" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="528" y="145" width="384" height="110" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="1000" y="145" width="384" height="110" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="80" y="373" width="790" height="130" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="925" y="373" width="430" height="130" rx="12" fill="#f5f0fb" stroke="#bba5d7" stroke-width="2"/><rect x="80" y="689" width="405" height="180" rx="12" fill="#edf8f5" stroke="#88beb1" stroke-width="2"/><rect x="520" y="689" width="405" height="180" rx="12" fill="#f5f0fb" stroke="#bba5d7" stroke-width="2"/><rect x="960" y="689" width="395" height="180" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="80" y="937" width="845" height="175" rx="12" fill="#edf8f5" stroke="#88beb1" stroke-width="2"/><rect x="960" y="937" width="395" height="175" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="80" y="1238" width="1275" height="125" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="80" y="1430" width="840" height="135" rx="12" fill="#edf8f5" stroke="#88beb1" stroke-width="2"/><rect x="970" y="1430" width="385" height="135" rx="12" fill="#f5f0fb" stroke="#bba5d7" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="60" font-size="34" fill="#17324d" text-anchor="start" font-weight="600">TSBench · 原生默认架构</text><text x="56" y="99" font-size="21" fill="#536579" text-anchor="start" font-weight="400">2026-10-15｜38 CPU keys（含raw）已实测｜4872/4872批次｜715 tests passed</text><text x="248.0" y="194.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">experiment.toml</text><text x="248.0" y="226.0" font-size="18" fill="#536579" text-anchor="middle" font-weight="400">任务 / dtype / layout / 质量 / 资源</text><text x="720.0" y="194.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">数据与同输入分母</text><text x="720.0" y="226.0" font-size="18" fill="#536579" text-anchor="middle" font-weight="400">canonical V / T / mask；有效 bytes</text><text x="1192.0" y="194.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">codec 来源与构建</text><text x="1192.0" y="226.0" font-size="18" fill="#536579" text-anchor="middle" font-weight="400">真实源码 / 参数 / 模型 / binary 身份</text><text x="80" y="349" font-size="24" fill="#17324d" text-anchor="start" font-weight="600">Python 控制面 · 均在原生主计时外</text><text x="475.0" y="416.5" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">config / runner / worker</text><text x="475.0" y="449.5" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">解析 → 完整请求矩阵 → 资格 → prepare / warmup → schedule</text><text x="475.0" y="478.5" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">隔离 / timeout / retry / 失败分母；正式计时独占串行</text><text x="1140.0" y="403.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">资格与验证基准</text><text x="1140.0" y="435.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">implementation / exact-input</text><text x="1140.0" y="463.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">输入与stream准入在主计时外</text><text x="1140.0" y="491.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">content hash / dtype / shape / layout</text><text x="80" y="659" font-size="24" fill="#17324d" text-anchor="start" font-weight="600">隔离 worker 内的三条边界 · 38 key direct 已验证</text><text x="282.5" y="744.5" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">native_core · 默认 / 已验证</text><text x="282.5" y="777.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">37 codec + raw；双生命周期实测</text><text x="282.5" y="805.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">C++ 内部循环 + CLOCK_MONOTONIC</text><text x="282.5" y="833.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">prepared / fresh_request 分列</text><text x="722.5" y="744.5" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">native_api · 辅助 / 已实现</text><text x="722.5" y="777.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">C++ 内部循环调用 C1 / RW</text><text x="722.5" y="805.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">shim 扫描 / 转换 / 内部分配计入</text><text x="722.5" y="833.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">不可称 pure core；完整性另审核</text><text x="1157.5" y="744.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">object_memory · 已有辅助</text><text x="1157.5" y="776.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">Python wall：scheme → 完整 wire</text><text x="1157.5" y="804.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">独立 encoder / decoder session</text><text x="1157.5" y="832.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">适配 / hash / JSON / close 计入</text><text x="502.5" y="974.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">真实输出 / 完成 / 每份恢复</text><text x="502.5" y="1007.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">主大小：codec 必要 header / 参数 / 模型 / index / tail</text><text x="502.5" y="1036.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">storage：按需caller容量；独立owner在context关闭后有效</text><text x="502.5" y="1065.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">每次必需 reset / sampling / modeling / Finish 仍计时</text><text x="502.5" y="1094.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">API 输出 / ABI envelope / framework wire 实证分账</text><text x="1157.5" y="989.5" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">保留 GPU / pool</text><text x="1157.5" y="1021.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">host/device completion 各具名</text><text x="1157.5" y="1049.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">集合 wall 与传输属于辅助边界</text><text x="1157.5" y="1077.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">旧结果保留原身份和真实失败</text><text x="717.5" y="1279.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">计时外逐产物验证 → append-only raw</text><text x="717.5" y="1312.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">验证每份实际压缩 / 恢复输出、原始域质量、输入未改；不只验证最后一份</text><text x="717.5" y="1341.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">native totals / loops / clock / bytes 账单 / 状态；失败时间仅诊断</text><text x="500.0" y="1476.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">只读 report：主表 core，API / object 辅助</text><text x="500.0" y="1509.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">压缩倍数 / bits-value / native 吞吐；prepared 与 fresh 分表</text><text x="500.0" y="1538.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">未知完整性 / 未接入 core：null / unsupported，保留分母</text><text x="1162.5" y="1475.5" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">可选 profiling</text><text x="1162.5" y="1507.5" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">同 manifest，另开 pass</text><text x="1162.5" y="1536.5" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">RSS / perf / GPU / energy</text><text x="56" y="1613" font-size="21" fill="#536579" text-anchor="start" font-weight="400">虚线：独立 profiling；358请求 / 348完整 / 10不支持；历史API / object保留原身份。</text></g></svg>