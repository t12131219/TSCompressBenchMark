dth="54.0" height="26" rx="4" fill="#ffffff"/><rect x="979.0" y="1013" width="92.0" height="26" rx="4" fill="#ffffff"/><rect x="360" y="1183" width="620" height="101" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="1070" y="1183" width="285" height="101" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="773.5" y="1133" width="113.0" height="26" rx="4" fill="#ffffff"/><rect x="809.0" y="1368" width="120.0" height="26" rx="4" fill="#ffffff"/><rect x="80" y="1442" width="420" height="109" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="620" y="1442" width="350" height="109" rx="12" fill="#edf8f5" stroke="#88beb1" stroke-width="2"/><rect x="1080" y="1442" width="275" height="109" rx="12" fill="#f5f0fb" stroke="#bba5d7" stroke-width="2" stroke-dasharray="8 6"/><rect x="514.5" y="1460" width="91.0" height="26" rx="4" fill="#ffffff"/><rect x="979.0" y="1460" width="92.0" height="26" rx="4" fill="#ffffff"/><text x="56" y="60" font-size="34" fill="#17324d" text-anchor="start" font-weight="600">TSBench 4.0 · 框架模块结构</text><text x="56" y="99" font-size="21" fill="#536579" text-anchor="start" font-weight="400">独立 Python benchmark｜CPU 对象主路径已实施｜pool 为独立工具｜cuSZp GPU host/device 已接入</text><text x="248.0" y="191.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">一份 experiment.toml</text><text x="248.0" y="224.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">对象 / 方法 / 质量 / 边界 / 资源</text><text x="720.0" y="191.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">时序数据源</text><text x="720.0" y="224.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">npy / CSV / source catalog</text><text x="1192.0" y="191.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">保留的 codec 资产</text><text x="1192.0" y="224.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">源码 / 必要模型 / 真实构建配方</text><text x="248.0" y="369.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">CLI / config</text><text x="248.0" y="402.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">解析、校验、默认值展开</text><text x="720.0" y="369.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">data</text><text x="720.0" y="402.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">canonical V / T / mask 与身份</text><text x="1192.0" y="369.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">registry / build</text><text x="1192.0" y="402.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">能力、factory、构建库与身份</text><text x="80" y="527" font-size="24" fill="#17324d" text-anchor="start" font-weight="600">控制与调度 · 父进程</text><text x="475.0" y="587.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">runner</text><text x="475.0" y="620.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">case 矩阵 / 随机 schedule / 预算 / resume</text><text x="475.0" y="648.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">默认主计时顺序执行；父进程补记异常</text><text x="1140.0" y="587.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">资格缓存</text><text x="1140.0" y="620.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">implementation / exact-input</text><text x="1140.0" y="648.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">只复用已通过范围</text><text x="720" y="746" font-size="19" fill="#2467a9" text-anchor="middle" font-weight="400">case / input / library / profile · IPC</text><text x="80" y="817" font-size="24" fill="#17324d" text-anchor="start" font-weight="600">隔离 worker · method × resource profile × session</text><text x="717.5" y="881.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">executor：计时边界、生命周期、实际资源与完成</text><text x="717.5" y="914.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">CPU wall 已实施；pool 独立 workload；cuSZp GPU host/device completion 已实施</text><text x="270.0" y="1031.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">scheme / artifact</text><text x="270.0" y="1064.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">适配 / 组合 / Finish / packing</text><text x="270.0" y="1092.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">对象 → 完整 wire</text><text x="775.0" y="1031.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">DecoderRegistry</text><text x="775.0" y="1064.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">wire → 新 decoder session</text><text x="775.0" y="1092.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">逆变换 / 完整恢复 / close</text><text x="1212.5" y="1031.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">validate</text><text x="1212.5" y="1064.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">恢复 / 原始域质量</text><text x="1212.5" y="1092.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">输入未改 · 计时外</text><text x="360" y="970" font-size="19" fill="#2467a9" text-anchor="middle" font-weight="400">encode 计时</text><text x="865" y="970" font-size="19" fill="#2467a9" text-anchor="middle" font-weight="400">decode 计时</text><text x="515" y="1034" font-size="19" fill="#14786c" text-anchor="middle" font-weight="400">wire</text><text x="1025" y="1034" font-size="19" fill="#14786c" text-anchor="middle" font-weight="400">恢复对象</text><text x="670.0" y="1227.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">C / RW / CUDA bridges</text><text x="670.0" y="1260.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">CPU ABI；GPU 独立 opaque owner / 完成 API</text><text x="1212.5" y="1227.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">native codec</text><text x="1212.5" y="1260.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">构建库 / 必要模型</text><text x="830" y="1154" font-size="19" fill="#2467a9" text-anchor="middle" font-weight="400">调用 codec</text><text x="80" y="1310" font-size="20" fill="#536579" text-anchor="start" font-weight="400">decoder 只从 wire 与已计费依赖恢复；原始对象保留在验证端。</text><text x="869" y="1389" font-size="19" fill="#14786c" text-anchor="middle" font-weight="400">worker 结果</text><text x="80" y="1436" font-size="24" fill="#17324d" text-anchor="start" font-weight="600">原始记录与独立分析</text><text x="290.0" y="1476.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">records / run artifacts</text><text x="290.0" y="1509.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">manifest / JSONL / 代表 wire</text><text x="290.0" y="1537.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">worker 结果 + 父进程终态</text><text x="795.0" y="1476.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">report / study</text><text x="795.0" y="1509.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">描述 / 覆盖 / 失败</text><text x="795.0" y="1537.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">配对 / source-cluster 统计</text><text x="1217.5" y="1476.0" font-size="22" fill="#17324d" text-anchor="middle" font-weight="600">profiling · 可选</text><text x="1217.5" y="1507.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">同 manifest，另开 pass</text><text x="1217.5" y="1534.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">RSS / 显存 / perf</text><text x="560" y="1481" font-size="19" fill="#14786c" text-anchor="middle" font-weight="400">读取 raw</text><text x="1025" y="1481" font-size="19" fill="#7655a5" text-anchor="middle" font-weight="400">附加结果</text><text x="56" y="1620" font-size="20" fill="#536579" text-anchor="start" font-weight="400">实线：核心关系 / 调用；虚线：独立 profiling 或异常补记。pool 与边界实验另存身份和 raw。</text></g></svg>