d="M 168 1727 L 34 1727 L 34 1011 L 88 1011" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 833 1727 L 990 1727" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 1185 1674 L 1185 1637 L 1426 1637 L 1426 497 L 913 497" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 500.5 1780 L 500.5 1835" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 500.5 1917 L 500.5 1966" fill="none" stroke="#14786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-14786c)"/><path d="M 913 1590 L 950 1590 L 950 1933 L 1185 1933 L 1185 1966" fill="none" stroke="#7655a5" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-7655a5)" stroke-dasharray="8 6"/><path d="M 990 2029 L 913 2029" fill="none" stroke="#7655a5" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-7655a5)" stroke-dasharray="8 6"/><rect x="88" y="151" width="825" height="82" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="88" y="279" width="825" height="113" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="990" y="279" width="390" height="113" rx="12" fill="#fff2ed" stroke="#d9a495" stroke-width="2"/><rect x="924.0" y="296" width="54.0" height="26" rx="4" fill="#ffffff"/><rect x="88" y="437" width="825" height="120" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="445.0" y="399" width="111.0" height="26" rx="4" fill="#ffffff"/><polygon points="500.5,617 833,670.0 500.5,723 168,670.0" fill="#f4f0fb" stroke="#bba5d7" stroke-width="2"/><rect x="990" y="597" width="390" height="160" rx="12" fill="#f5f0fb" stroke="#bba5d7" stroke-width="2"/><rect x="884.0" y="631" width="54.0" height="26" rx="4" fill="#ffffff"/><rect x="990" y="803" width="390" height="86" rx="12" fill="#fff2ed" stroke="#d9a495" stroke-width="2"/><rect x="1198.5" y="764" width="73.0" height="26" rx="4" fill="#ffffff"/><rect x="88" y="822" width="825" height="93" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="416.5" y="752" width="168.0" height="26" rx="4" fill="#ffffff"/><rect x="859.0" y="759" width="62.0" height="26" rx="4" fill="#ffffff"/><rect x="88" y="965" width="825" height="93" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="115" y="1158" width="771" height="77" rx="12" fill="#edf8f5" stroke="#88beb1" stroke-width="2"/><rect x="115" y="1259" width="771" height="77" rx="12" fill="#edf8f5" stroke="#88beb1" stroke-width="2"/><rect x="115" y="1360" width="771" height="77" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="990" y="1259" width="390" height="200" rx="12" fill="#fff2ed" stroke="#d9a495" stroke-width="2"/><rect x="924.0" y="1260" width="54.0" height="26" rx="4" fill="#ffffff"/><rect x="88" y="1514" width="825" height="102" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><polygon points="500.5,1674 833,1727.0 500.5,1780 168,1727.0" fill="#f4f0fb" stroke="#bba5d7" stroke-width="2"/><rect x="97.5" y="1628" width="215.0" height="26" rx="4" fill="#ffffff"/><rect x="990" y="1674" width="390" height="153" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="855.5" y="1685" width="111.0" height="26" rx="4" fill="#ffffff"/><rect x="88" y="1835" width="825" height="82" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="483.0" y="1797" width="35.0" height="26" rx="4" fill="#ffffff"/><rect x="88" y="1966" width="825" height="103" rx="12" fill="#edf8f5" stroke="#88beb1" stroke-width="2"/><rect x="990" y="1966" width="390" height="103" rx="12" fill="#f5f0fb" stroke="#bba5d7" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="60" font-size="34" fill="#17324d" text-anchor="start" font-weight="600">TSBench 4.0 · 一次实验的运行流程</text><text x="56" y="99" font-size="21" fill="#536579" text-anchor="start" font-weight="400">展开比较 block / session 的主路径｜默认 object_memory｜loops = 1｜正式每 trial 都恢复并验证</text><text x="500.5" y="185.5" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">读取一份配置</text><text x="500.5" y="218.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">数据 / 方法 / 质量 / 边界 / 资源 profile</text><text x="500.5" y="329.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">展开请求 case 矩阵</text><text x="500.5" y="362.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">对象与方法身份、支持范围、预算和比较条件</text><text x="1185.0" y="314.0" font-size="22" fill="#17324d" text-anchor="middle" font-weight="600">静态不支持 / 缺环境</text><text x="1185.0" y="345.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">保留 case 及原因</text><text x="1185.0" y="373.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">unsupported / unavailable</text><text x="951" y="317" font-size="19" fill="#b45346" text-anchor="middle" font-weight="400">拒绝</text><text x="500.5" y="476.5" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">准备方法 / session 的隔离 worker</text><text x="500.5" y="509.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">pool / 设备初始化 / first-touch 前落实资源政策</text><text x="500.5" y="537.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">加载库与当前 block，核验有效资源；不符则拒绝或另分层</text><text x="500.5" y="420" font-size="19" fill="#2467a9" text-anchor="middle" font-weight="400">可执行候选</text><text x="500.5" y="678.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">所需资格缓存都命中？</text><text x="1185.0" y="643.0" font-size="22" fill="#17324d" text-anchor="middle" font-weight="600">只补未命中的必要检查</text><text x="1185.0" y="674.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">implementation suite</text><text x="1185.0" y="701.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">exact-input：wire-only 新进程恢复</text><text x="1185.0" y="728.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">PASS 更新缓存</text><text x="911" y="652" font-size="19" fill="#7655a5" text-anchor="middle" font-weight="400">缺项</text><text x="1185.0" y="839.0" font-size="22" fill="#17324d" text-anchor="middle" font-weight="600">资格失败：保留真实终态</text><text x="1185.0" y="870.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">stage / reason / 证据</text><text x="1235" y="785" font-size="19" fill="#b45346" text-anchor="middle" font-weight="400">未通过</text><text x="500.5" y="862.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">计时诊断 / 校准 → 在本 worker 预热</text><text x="500.5" y="895.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">丢弃预热 codec session；首版固定 loops = 1</text><text x="500.5" y="773" font-size="19" fill="#2467a9" text-anchor="middle" font-weight="400">命中：跳对应检查</text><text x="890" y="780" font-size="19" fill="#7655a5" text-anchor="middle" font-weight="400">PASS</text><text x="500.5" y="1005.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">保存可执行 schedule 与 resolved manifest</text><text x="500.5" y="1038.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">保存 / 读取既定顺序；发出 trial，记录 planned / started</text><text x="112" y="1144" font-size="24" fill="#17324d" text-anchor="start" font-weight="600">每次正式 trial · 新 codec session / 新 decoder session</text><text x="500.5" y="1190.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">encode 计时</text><text x="500.5" y="1222.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">对象 → 完整 wire；本次 encoder 关闭完成</text><text x="500.5" y="1291.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">decode 计时</text><text x="500.5" y="1323.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">wire → 新 decoder session → 完整对象；decoder 关闭完成</text><text x="500.5" y="1392.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">计时外验证</text><text x="500.5" y="1424.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">恢复 / 原始域误差 / 输入不变；违例为 error（reason = quality_violation）</text><text x="1185.0" y="1311.0" font-size="21" fill="#17324d" text-anchor="middle" font-weight="600">任意 stage 异常 / 错误</text><text x="1185.0" y="1341.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">native error + stage / reason</text><text x="1185.0" y="1368.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">crash / timeout / 有证据的 oom</text><text x="1185.0" y="1395.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">失效 worker 不复用；清理后重建</text><text x="1185.0" y="1422.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">GPU 恢复未确认：余项 not_run</text><text x="951" y="1281" font-size="19" fill="#b45346" text-anchor="middle" font-weight="400">异常</text><text x="500.5" y="1545.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">追加原始记录与必要工件</text><text x="500.5" y="1577.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">encode/decode_ns、完整 bytes、wire hash、质量、实际资源与终态</text><text x="500.5" y="1604.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">失败、retry attempt 和未运行项均保留</text><text x="500.5" y="1735.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">runner 还有待执行计划项？</text><text x="205" y="1649" font-size="19" fill="#2467a9" text-anchor="middle" font-weight="400">是：已就绪健康 worker</text><text x="1185.0" y="1716.0" font-size="21" fill="#17324d" text-anchor="middle" font-weight="600">新 case/session 或 worker 失效</text><text x="1185.0" y="1746.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">记录终态后推进其他 case</text><text x="1185.0" y="1773.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">清理 / 重建，再查询资格缓存</text><text x="1185.0" y="1800.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">已停用设备的 not_run 项不再调度</text><text x="911" y="1706" font-size="19" fill="#2467a9" text-anchor="middle" font-weight="400">是：需准备</text><text x="500.5" y="1869.5" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">全部结束：关闭剩余 worker / session</text><text x="500.5" y="1902.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">GPU 恢复未确认时结束设备 session，余项已记 not_run</text><text x="500.5" y="1818" font-size="19" fill="#2467a9" text-anchor="middle" font-weight="400">否</text><text x="500.5" y="1997.5" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">读取 raw → 描述报告 / 可选研究统计</text><text x="500.5" y="2029.5" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">覆盖与失败、条件性能、完整大小、时间分布</text><text x="500.5" y="2056.5" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">重绘报告只读 raw</text><text x="1185.0" y="1997.0" font-size="22" fill="#17324d" text-anchor="middle" font-weight="600">可选：独立 profiling pass</text><text x="1185.0" y="2028.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">同 manifest，资源采样另一次执行</text><text x="1185.0" y="2055.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">profile 结果可加入重生成报告</text><text x="56" y="2124" font-size="21" fill="#536579" text-anchor="start" font-weight="400">资格缓存只省必要预检；重复 trial 回到已保存 schedule，逐次恢复校验始终执行。</text></g></svg>