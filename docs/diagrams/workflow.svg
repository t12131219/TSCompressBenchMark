<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2160" viewBox="0 0 1440 2160" role="img"><title>TSBench V4.0 workflow.svg</title><desc>依据V4.0计划绘制。CPU对象主路径与cuSZp GPU host/device执行器已实现；进程pool作为独立workload工具。</desc><defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrow-2467a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2467a9"/></marker><marker id="arrow-14786c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14786c"/></marker><marker id="arrow-7655a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7655a5"/></marker><marker id="arrow-b45346" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45346"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="88" y="1110" width="825" height="346" rx="18" fill="#fcfdff" stroke="#c5d1de" stroke-width="1.8"/><path d="M 500.5 233 L 500.5 279" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 913 335 L 990 335" fill="none" stroke="#b45346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-b45346)"/><path d="M 500.5 392 L 500.5 437" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 500.5 557 L 500.5 617" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 833 670 L 990 670" fill="none" stroke="#7655a5" stroke-width="2.4" stroke-linejoin="roun