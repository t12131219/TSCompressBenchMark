<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1960" viewBox="0 0 1440 1960" role="img"><title>TSBench V4.0 workflow.svg</title><desc>依据V4.0计划绘制。2026-10-15设计修订：37真实CPU codec加raw，共38个key已完成两个生命周期直接原生测量；28组358请求、348完整有效、10不支持，4872/4872正式批次成功，715项测试通过；输入与流验证在主计时外，storage区分caller和owner；此前六组2534/2534 trials保留历史身份，C1/RW API及object辅助继续保留。</desc><defs><marker id="arrow-64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrow-2467a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2467a9"/></marker><marker id="arrow-14786c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14786c"/></marker><marker id="arrow-7655a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7655a5"/></marker><marker id="arrow-b45346" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45346"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="88" y="834" width="825" height="440" rx="18" fill="#fcfdff" stroke="#c5d1de" stroke-width="1.8"/><path d="M 500.5 245 L 500.5 306" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 913 365 L 990 365" fill="none" stroke="#b45346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-b45346)"/><path d="M 500.5 426 L 500.5 487" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 500.5 612 L 500.5 673" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 500.5 773 L 500.5 834" fill="none" stroke="#14786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-14786c)"/><path d="M 500.5 999 L 500.5 1042" fill="none" stroke="#14786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-14786c)"/><path d="M 500.5 1142 L 500.5 1180" fill="none" stroke="#14786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-14786c)"/><path d="M 913 723 L 1185 723 L 1185 890" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 913 1050 L 965 1050 L 965 1250 L 990 1250" fill="none" stroke="#b45346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-b45346)" stroke-dasharray="8 6"/><path d="M 500.5 1274 L 500.5 1335" fill="none" stroke="#14786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-14786c)"/><path d="M 500.5 1470 L 500.5 1525" fill="none" stroke="#14786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-14786c)"/><path d="M 88 1580 L 38 1580 L 38 725 L 88 725" fill="none" stroke="#2467a9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-2467a9)"/><path d="M 1380 382 L 1412 382 L 1412 1580 L 913 1580" fill="none" stroke="#b45346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-b45346)"/><path d="M 1380 1250 L 1412 1250 L 1412 1580 L 913 1580" fill="none" stroke="#b45346" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-b45346)"/><path d="M 500.5 1635 L 500.5 1715" fill="none" stroke="#14786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-14786c)"/><path d="M 913 1777 L 990 1777" fill="none" stroke="#7655a5" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow-7655a5)" stroke-dasharray="8 6"/><rect x="88" y="145" width="825" height="100" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="88" y="306" width="825" height="120" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="990" y="306" width="390" height="150" rx="12" fill="#fff2ed" stroke="#d9a495" stroke-width="2"/><rect x="88" y="487" width="825" height="125" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="88" y="673" width="825" height="100" rx="12" fill="#edf5ff" stroke="#8eb6de" stroke-width="2"/><rect x="115" y="889" width="771" height="110" rx="12" fill="#edf8f5" stroke="#88beb1" stroke-width="2"/><rect x="115" y="1042" width="771" height="100" rx="12" fill="#edf8f5" stroke="#88beb1" stroke-width="2"/><rect x="115" y="1180" width="771" height="75" rx="12" fill="#edf8f5" stroke="#88beb1" stroke-width="2"/><rect x="337.5" y="1008" width="326.0" height="26" rx="4" fill="#ffffff"/><rect x="990" y="890" width="390" height="230" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="990" y="1175" width="390" height="150" rx="12" fill="#fff2ed" stroke="#d9a495" stroke-width="2"/><rect x="88" y="1335" width="825" height="135" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="88" y="1525" width="825" height="110" rx="12" fill="#f5f7fa" stroke="#b8c5d2" stroke-width="2"/><rect x="103.5" y="1478" width="93.0" height="26" rx="4" fill="#ffffff"/><rect x="88" y="1715" width="825" height="125" rx="12" fill="#edf8f5" stroke="#88beb1" stroke-width="2"/><rect x="454.5" y="1666" width="92.0" height="26" rx="4" fill="#ffffff"/><rect x="990" y="1715" width="390" height="125" rx="12" fill="#f5f0fb" stroke="#bba5d7" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="60" font-size="34" fill="#17324d" text-anchor="start" font-weight="600">TSBench · 原生默认运行流程</text><text x="56" y="99" font-size="21" fill="#536579" text-anchor="start" font-weight="400">2026-10-15｜38 key / 4872成功批次｜准入与流验证在主计时外｜715 tests passed</text><text x="500.5" y="188.5" font-size="25" fill="#17324d" text-anchor="middle" font-weight="600">读取配置：默认 native_core / prepared / natural</text><text x="500.5" y="222.5" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">native_api 辅助；object_memory / independent_object 保留</text><text x="500.5" y="344.5" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">同输入任务 → 全请求 case 矩阵</text><text x="500.5" y="377.5" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">固定 dtype / shape / layout / 有效 bytes / 质量 / 分片</text><text x="500.5" y="406.5" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">不含 ABI envelope、padding、逐列重复共享 T</text><text x="1185.0" y="346.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">入口 / 能力不支持</text><text x="1185.0" y="378.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">未接入 core 不 fallback</text><text x="1185.0" y="406.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">保留 unsupported / unavailable</text><text x="1185.0" y="434.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">不能核实必要输出：主大小 null</text><text x="500.5" y="528.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">worker prepare → 资格 → warmup / 固定预算</text><text x="500.5" y="561.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">真实输入身份与 validate_input 源域准入；主计时外</text><text x="500.5" y="590.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">storage按需分配；loops通常8／DZip为2；保留内存有界</text><text x="500.5" y="716.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">保存 schedule；父进程 planned / started</text><text x="500.5" y="749.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">主计时独占串行；Python 一次 batch 调用，循环在 C++ 内</text><text x="112" y="868" font-size="24" fill="#17324d" text-anchor="start" font-weight="600">C++ 原生 driver · 38 key direct 已验证；API辅助保留</text><text x="500.5" y="924.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">完整 encode 批次：原生时钟</text><text x="500.5" y="956.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">独立 reset → 必需采样 / 建模 / encode / Finish → 保留每份输出</text><text x="500.5" y="983.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">prepared 复用 workspace；fresh 含 context / buffer 分配及 context 关闭</text><text x="500.5" y="1071.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">完整 decode 批次：原生时钟</text><text x="500.5" y="1103.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">独立decoder，无encoder参数或免费外部模型</text><text x="500.5" y="1131.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">已验不可变stream → 必需decode → 保留每份恢复</text><text x="500.5" y="1211.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">返回真实 encode / decode totals、loops、输出数</text><text x="500.5" y="1243.0" font-size="19" fill="#536579" text-anchor="middle" font-weight="400">Python 不减估计开销；内循环不算独立样本</text><text x="500.5" y="1029" font-size="19" fill="#14786c" text-anchor="middle" font-weight="400">计时外 validate：每份不可变stream</text><text x="1185.0" y="942.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">独立辅助分支</text><text x="1185.0" y="974.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">native_api：完整 C1 / RW ABI</text><text x="1185.0" y="1002.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">含 shim 解析 / 转换 / 分配</text><text x="1185.0" y="1030.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">object：完整 wire 和 Python wall</text><text x="1185.0" y="1058.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">GPU / pool：各自完成边界</text><text x="1185.0" y="1086.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">分表记录，不冒称 core</text><text x="1185.0" y="1215.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">错误 / 崩溃 / 超时</text><text x="1185.0" y="1247.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">保留 stage / reason / attempt</text><text x="1185.0" y="1275.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">恢复未通过：时间仅诊断</text><text x="1185.0" y="1303.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">父进程补终态、清理后重建</text><text x="500.5" y="1381.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">计时外：逐份恢复 / 质量 / 输入不变验证</text><text x="500.5" y="1414.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">每个计时 operation 的真实输出均覆盖，不只最后一份</text><text x="500.5" y="1443.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">codec 必要输出实证账单；unknown → 主大小 null</text><text x="500.5" y="1559.0" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">追加 raw / 必要工件；推进既定 schedule</text><text x="500.5" y="1591.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">ok / error / unsupported / not_run 和原失败保留</text><text x="500.5" y="1619.0" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">下轮不重跑全资格；新 session / 失效 worker 按身份准备</text><text x="150" y="1499" font-size="19" fill="#2467a9" text-anchor="middle" font-weight="400">下一 trial</text><text x="500.5" y="1756.0" font-size="24" fill="#17324d" text-anchor="middle" font-weight="600">关闭 → 只读主 / 辅助报告</text><text x="500.5" y="1789.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">core 压缩倍数 / bits-value / 原生吞吐；prepared / fresh 分表</text><text x="500.5" y="1818.0" font-size="21" fill="#536579" text-anchor="middle" font-weight="400">覆盖与失败完整；API / wire / object 延迟仅作辅助</text><text x="500.5" y="1687" font-size="19" fill="#14786c" text-anchor="middle" font-weight="400">全部结束</text><text x="1185.0" y="1756.5" font-size="23" fill="#17324d" text-anchor="middle" font-weight="600">独立 profiling pass</text><text x="1185.0" y="1788.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">同 manifest，另一次执行</text><text x="1185.0" y="1816.5" font-size="20" fill="#536579" text-anchor="middle" font-weight="400">不与正式测量 / 构建并行</text><text x="56" y="1905" font-size="21" fill="#536579" text-anchor="start" font-weight="400">fresh 保留产物最终释放在计时外；旧 object raw 不回填 native 字段，正式测量使用新 run。</text></g></svg>