[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tscompbench"
version = "0.1.0"
description = "Contract-driven time-series compression benchmark control plane"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["numpy>=2.5,<3"]

[project.scripts]
tscompbench = "tscompbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

