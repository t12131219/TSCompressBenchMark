    unmodified segmentation, aggregation, and inverse modules and freezes stable tie
    and zero-variance behavior. Nine vectors and three UCR datasets were frozen before
    canonical work.
  G3:
    status: PASS
    inputs:
    - scalar C++17 pipeline
    - frozen oracle and dataset plan
    outputs:
    - fabba.hpp
    - fabba.cpp
    - unit and differential tests
